name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # No API key in CI: --ci packages config.template.js so the zip is still complete
      - name: Build
        run: npm run build -- --ci

      - uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: dist/*.zip
          retention-days: 14
